sonar.organization=ti-tecnologico-de-monterrey-oficial

sonar.projectKey=ti-tecnologico-de-monterrey-oficial_status-service-db
sonar.projectName=status-service-db

sonar.sourceEncoding=UTF-8

# Codigo fuente
sonar.sources=src,server.js

# Pruebas
sonar.tests=src,test
sonar.test.inclusions=src/**/*.test.js,test/**/*.test.js

sonar.exclusions=src/**/*.test.js,src/test-fixtures/**
sonar.coverage.exclusions=server.js,src/**/*.test.js,src/test-fixtures/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Esperar resultado del Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
