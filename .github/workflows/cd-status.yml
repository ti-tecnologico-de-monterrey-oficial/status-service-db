name: CD · status-service-db

# Los `paths` listan lo que entra en la imagen. Un cambio en el README, en las
# pruebas o en los .env de ejemplo no produce una imagen distinta, así que
# tampoco dispara un despliegue.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'patches/**'
      - '!src/**/*.test.js'
      - '!src/test-fixtures/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/cd-status.yml'
      - '.github/workflows/_deploy-aca.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --omit=peer
      - run: npm run test
      - run: node --test test/integrity.unit.test.js

  dev:
    needs: [validate]
    name: Desplegar a Dev
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-status-devl
      ACA_ENVIRONMENT: Dev
    secrets: inherit
