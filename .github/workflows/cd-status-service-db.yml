name: CD · status-service-db

on:
  workflow_dispatch:
  push:
    branches: [develop, release, main]
    paths:
      - 'src/**'
      - '!src/**/*.test.js'
      - '!src/test-fixtures/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/cd-status-service-db.yml'
      - '.github/workflows/_deploy-aca.yml'

jobs:
  dev:
    name: Desplegar a Dev
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-status-devl
      ACA_ENVIRONMENT: Dev
    secrets: inherit

  release:
    name: Desplegar a PPRD
    if: github.ref_name == 'release'
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-status-pprd
      ACA_ENVIRONMENT: Pprd
    secrets: inherit

  main:
    name: Desplegar a Prod
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-status-prod
      ACA_ENVIRONMENT: Prod
    secrets: inherit

