name: CD · status-service-db

on:
  workflow_dispatch:
  push:
    branches: [develop, release, main]
    paths:
      - 'src/**'
      - '!src/**/*.test.js'
      - '!src/test-fixtures/**'
      - 'patches/**'
      - 'vendor/**'
      - '.npmrc'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/cd-status-service-db.yml'
      - '.github/workflows/_deploy-aca.yml'

jobs:
  pruebas:
    name: Pruebas con cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Ninguna imagen llega a un ambiente si sus pruebas o su umbral de
      # cobertura fallan en ese mismo commit.
      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

  dev:
    name: Desplegar a Dev
    if: github.ref_name == 'develop'
    needs: [pruebas]
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-status-devl
      ACA_ENVIRONMENT: Dev
    secrets: inherit

  release:
    name: Desplegar a PPRD
    if: github.ref_name == 'release'
    needs: [pruebas]
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-status-pprd
      ACA_ENVIRONMENT: Pprd
    secrets: inherit

  main:
    name: Desplegar a Prod
    if: github.ref_name == 'main'
    needs: [pruebas]
    uses: ./.github/workflows/_deploy-aca.yml
    with:
      CONTAINER_NAME: dcc-status-prod
      ACA_ENVIRONMENT: Prod
    secrets: inherit

